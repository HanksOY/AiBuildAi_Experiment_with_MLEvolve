# ============================================================
#  Data & paths
# ============================================================
data_dir: "/mnt/e/Internship/UCSD/Test v2.0.1/Test v2.0.1/public"
dataset_dir: "/mnt/e/Internship/UCSD/Test v2.0.1/Test v2.0.1/public"
desc_file: null
goal: |
  Build a CPU-only binary classifier that predicts whether a patient has meningitis from encoded EHR features. Allowed models are classical ML only: logistic regression, random forest, extra-trees, HistGradientBoosting, XGBoost or LightGBM in CPU mode, and SVM. Do not use deep learning or any GPU-dependent model.

  **There is no target column. Create one.** Each file is one class:
  - `full_encoded_meningitis.csv` (214 rows, 983 columns) → `target = 1`
  - `full_encoded_non_meningitis.xls` → `target = 0`

  Concatenate the two files after aligning their columns.

  **Data traps:**
  - **Misleading extension:** the 645 MB `.xls` is almost certainly delimited text, not a real Excel file. Inspect the first bytes before choosing a reader. Do not call an Excel reader blindly.
  - **Size:** the negative file is large (likely hundreds of thousands of rows). Read it in chunks. Cast the 0/1 code columns to `uint8` or sparse, and avoid float64 copies.
  - **Schema mismatch:** the files may differ in which columns they have or their order. Align them on column names. Fill codes missing from one file with 0, and log the differences.
  - **Extreme imbalance:** there are about 214 positives against a very large negative set. Use class weights or negative subsampling for training only. Never subsample the validation data.
  - **Label leakage:** the columns are ICD-9 diagnosis codes, and several of them define meningitis itself. Drop every code that encodes a meningitis diagnosis. This includes at least 320\*, 321\*, 322\*, 0360, 0130, 047\*, 0490, 0530, 05472, 0721, 09181, 0942, 09882, 10081, 11283, 1142, and 115x1. Also review 036\* (meningococcal codes such as `0362`). Log every dropped column.
  - **Drop** `SUBJECT_ID` as a feature, but keep it as the row ID. Check for duplicate IDs within and across files. Encode `GENDER` as binary.
  - Ignore `MLEvolve prompt.doc`. It is not data.
eval: |
  **Metric:** Average Precision (PR-AUC) on the positive class. Higher is better. Also report ROC-AUC, but only for information.

  **Validation:** stratified 5-fold cross-validation over all rows, with a fixed seed (42). Group the folds by `SUBJECT_ID` if any ID repeats. Fit all preprocessing and resampling inside each fold. The score is the Average Precision of the pooled out-of-fold predictions.

  **Required outputs:**
  - `./submission/submission.csv` with columns `SUBJECT_ID, target, prediction`. It must contain one row per patient, where `prediction` is the out-of-fold probability of meningitis.
  - A printed list of the dropped leakage columns, the ROC-AUC, and the class counts.

  The final line printed must be exactly:
  `print(f"Final Validation Score: {score}")`
exp_name: "first_test"
exp_id: "exp01"

log_dir: ./runs
log_level: INFO
workspace_dir: ./runs
preprocess_data: True
copy_data: False

# Resource
start_cpu_id: 0
cpu_number: 11

# Model paths
torch_hub_dir: ""       # path to torch hub cache, e.g. /data/pretrain_models/torch_models
pretrain_model_dir: ""  # path to pretrained model weights, e.g. /data/pretrain_models

# ============================================================
#  Code execution
# ============================================================
exec:
  timeout: 32400
  agent_file_name: runfile.py

# ============================================================
#  Agent config
# ============================================================
agent:

  # --- Basic run params ---
  steps: 200
  time_limit: 3600
  initial_drafts: 3
  seed: 42
  data_preview: True

  # --- LLM models ---
  # API keys are read from the environment (see .env.example); never hard-code
  # them here, this file is git-tracked.
  code:
    model: claude-code:claude-opus-5-5
    temp: 1
    base_url: ""
    api_key: ${oc.env:MLEVOLVE_CODE_API_KEY,""}
    # Reasoning models spend part of this budget thinking. Too low and the code
    # block is cut mid-token, the ``` fence never closes, and extraction fails
    # (then retries 3x at full cost). Raise if you see truncation warnings.
    max_tokens: 65536
  feedback:
    model: claude-code:claude-sonnet-5
    temp: 1
    base_url: ""
    api_key: ${oc.env:MLEVOLVE_FEEDBACK_API_KEY,""}
    max_tokens: 16384

  # --- Submission check ---
  check_data_leakage: True

  # --- Code gen mode ---
  use_diff_mode: True                 # Multi-Mode Codegen
  use_stepwise_generation: True       # Multi-Mode Codegen

  # --- Triggered-action master switches (ablation use) ---
  use_evolution: True                # intra-branch evolution on stagnation
  use_fusion: True                   # cross-branch fusion on stagnation (>=6h)
  use_aggregation: True              # multi-branch aggregation at root

  # --- Branch strategy ---
  fusion_vs_evolution_prob: 0.3
  branch_fusion_trigger_prob: 1.0
  max_fusion_drafts: 2

  # --- Global memory ---
  use_global_memory: True
  memory_similarity_threshold: 0.7
  memory_embedding_device: cpu
  memory_embedding_model_path: "BAAI/bge-base-en-v1.5"  # HuggingFace model name or local path

  # --------------------------------------------------------
  #  Search tree params
  # --------------------------------------------------------
  search:
    # Parallel & resources
    parallel_search_num: 3
    num_gpus: 0

    # Node expansion limits
    num_drafts: 3
    num_bugs: 1
    num_improves: 2
    topk_max_improves: 10

    # Debug depth
    max_debug_depth: 15
    back_debug_depth: 3
    debug_prob: 1

    # Improvement criteria
    metric_improvement_threshold: 0.0001
    # Sampling noise of the ranking metric. A gain smaller than this is a tie,
    # not an improvement, so the search stops chasing favourable splits.
    # Set it from your own CV spread: run a solution twice and take the std.
    # Measured here: PRAUC std ~0.026 across 5 folds at 0.46% prevalence.
    metric_noise_floor: 0.026
    # UCT value = (1-w)*mean + w*best-in-subtree. Mean backup suits games,
    # where you face an average of opponent replies. Here only the single
    # best solution is submitted, so a branch with one strong result and
    # some failures beats a uniformly mediocre one. 0.0 = original behaviour.
    max_backup_weight: 0.7
    max_improve_failure: 3

    # Stagnation detection
    branch_stagnation_threshold: 3
    topk_stagnation_threshold: 6
    stagnation_window: 4
    top_candidates_size: 20

    # Explore-exploit soft switch
    explore_switch_start: 0.5
    explore_switch_end: 0.7
    min_exploration_weight: 0.2       # Top-K enabled

    # Top-K node selection
    topk_early_k: 5
    topk_early_max_per_branch: 3
    topk_late_k: 3
    topk_late_max_per_branch: 2

    # Force backprop
    force_backprop_late_threshold: 0.80
    force_backprop_late_prob: 0.5
    force_backprop_mid_threshold: 0.4
    force_backprop_mid_modulo: 3
    recent_best_window: 4

    # Multi-branch fusion conditions
    fusion_min_time_hours: 6
    fusion_max_time_hours: 10
    fusion_min_successful_nodes: 2
    fusion_min_branches: 2

    # Stagnation detection master switch (ablation: set False for vanilla MCTS baseline)
    use_stagnation_detection: True

  # --------------------------------------------------------
  #  Exploration constant decay
  # --------------------------------------------------------
  decay:
    exploration_constant: 1.414
    lower_bound: 0.5
    alpha: 0.01
    phase_ratios: [0.3, 0.7]

# ============================================================
#  Task framing
# ============================================================
task:
  # How prompts describe the job (agents/prompts/framing.py).
  #   kaggle  - upstream wording: Kaggle grandmaster, leaderboard, MLE-Bench
  #             environment. Use for MLE-Bench comparisons.
  #   generic - neutral wording for any train-a-model, report-a-validation-score
  #             task. Also skips the MLE-Bench submission format server.
  profile: kaggle
  # true  - every solution must write ./submission/submission.csv (upstream).
  # false - the printed validation score is the result; a prediction file is
  #         written only if the task description asks for one. Use for tasks
  #         that have no test set to predict.
  require_submission: true

# ============================================================
#  Plan mode
# ============================================================
plan_mode:
  # The run drafts a plan, shows how clean_task_desc rewrote your goal, and
  # waits for approval before any search starts.
  # NOTE: a headless session (cron, nohup, piped stdin) cannot answer the
  # prompt and will abort rather than run unapproved. Unattended runs must
  # pass plan_mode.require_confirmation=False — run_single_task.sh already does.
  require_confirmation: true
  show_task_diff: true
  # The dashboard runs the EDA and plan steps itself, before launch, and passes
  # the approved task description (already cleaned) in desc_file. True skips
  # cleaning it again, which could rewrite the approved plan.
  preapproved: false

# ============================================================
#  Exploratory data analysis
# ============================================================
eda:
  # Before planning, write and run an analysis script against the real data,
  # confirm the report, then derive a data plan covering loading, cleaning,
  # leakage control, feature engineering and splitting. The approved plan is
  # appended to the task description every agent receives.
  # Saved as EDA_report.md in the run directory. Needs a terminal.
  enabled: true
  timeout: 900        # seconds for the analysis script itself
  max_attempts: 2     # regenerate the script this many times if it fails

# ============================================================
#  Draft review
# ============================================================
draft_review:
  # Pause after each initial draft is written, before it runs, so you can
  # read the code and accept, edit or reject it. Initial drafts only.
  # Needs a terminal; unattended runs must pass draft_review.enabled=False.
  enabled: true
  max_regenerations: 2
  # terminal: ask on stdin. file: the dashboard answers through
  # logs/draft_review_answers.jsonl; the run writes logs/draft_review.jsonl.
  channel: terminal

# ============================================================
#  Cold-start knowledge
# ============================================================
coldstart:
  use_coldstart: True                 # Cold-start KB enabled
  task_json_path: "engine/coldstart/competition_tag_classified.json"
  model_json_path: "engine/coldstart/models_guidance_classified.json"
  description: ""

# ============================================================
#  Dashboard recording (view with: python -m dashboard.server)
# ============================================================
monitor:
  enabled: true            # write logs/monitor_events.jsonl for the dashboard
  record_llm_calls: true   # one record per LLM call: agent, solution, tokens, seconds
  snapshot_outputs: true   # copy each solution's tables/figures to workspace/node_outputs/<id>/
  control: true            # accept Stop/Abort from the dashboard
